<title>Panda Diplomacy Battles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*@include pages/arena.css*/
</style>

<div id="app" data-layout="classic">
  <header id="bar">
    <h1>Panda Diplomacy <em>Battles</em></h1>
    <label class="bar-group"><span>Battle</span>
      <select id="scenario" aria-label="Choose a battle"></select>
    </label>
    <div class="bar-group"><span>Look</span>
      <div class="seg" id="layouts" role="group" aria-label="Battle layout"></div>
    </div>
    <div class="bar-group"><span>Models</span>
      <div class="seg" id="styles" role="group" aria-label="Model style"></div>
    </div>
    <div class="bar-spacer"></div>
    <div class="bar-group">
      <button class="icon-btn" id="speed" aria-pressed="false" title="Play animations twice as fast">2×</button>
      <button class="icon-btn" id="sound" aria-pressed="true" title="Sound on or off">🔊</button>
    </div>
  </header>
  <div id="main">
    <div id="stage">
      <canvas id="scene" aria-label="The battlefield"></canvas>
      <div id="overlay"></div>
      <div class="side" id="side-foe"></div>
      <div class="side" id="side-mine"></div>
      <div id="cutin"><div class="band"><span></span><small></small></div></div>
    </div>
    <div id="console">
      <div id="textbox" title="Tap to hurry the story along"><p id="say" aria-live="polite"></p><span class="next" hidden>▼</span></div>
      <div id="menu"></div>
    </div>
    <div id="result" hidden></div>
  </div>
</div>

window.CANNON = CANNON;
window.RoundedBoxGeometry = RoundedBoxGeometry;
