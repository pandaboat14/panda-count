<title>Since Your Last Turn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*@include pages/arena.css*/

/* ================= catch-up page ================= */
html, body { height: auto; }
body { overflow-x: hidden; overflow-y: auto; background: var(--night); }
#cu { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
.cu-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; padding: 18px 24px 14px; background: var(--forest-deep); border-bottom: 1px solid #0006; }
.cu-title { flex: 1 1 360px; min-width: 0; }
.cu-title .eyebrow { margin: 0; font: 800 .7rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: #dcc79cb3; }
.cu-title h1 { margin: 2px 0 4px; font: 800 clamp(1.6rem, 3.4vw, 2.3rem)/1.05 var(--serif); color: var(--cream); text-wrap: balance; }
.cu-title .sub { margin: 0; color: #fffaf3cc; font: 600 .95rem var(--sans); }
.cu-title .sub b { color: var(--gold); }
.cu-body { position: relative; padding: 18px 24px 28px; }
.variant { display: none; }
[data-variant="theater"] .v-theater, [data-variant="chronicle"] .v-chronicle, [data-variant="highlights"] .v-highlights { display: block; }

/* the embedded arena */
#app.embedded { height: 100%; display: block; }
#app.embedded #main { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr); }
#app.embedded #menu { display: none; }
#app.embedded #console { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 0; background: none; grid-template-columns: minmax(0, 1fr); pointer-events: none; }
#app.embedded #textbox { max-width: 640px; min-height: 0; padding: 9px 14px; pointer-events: auto; }
#app.embedded #say { min-height: 1.45em; font-size: .95rem; }
#app.embedded[data-layout="showdown"] #console { background: none; border: 0; }
#app.embedded[data-layout="showdown"] #textbox { background: #080f0bd9; padding: 9px 14px; border-radius: 10px; }
#app.embedded[data-layout="classic"] #side-mine { bottom: 74px; }
.slot { position: relative; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 20px 50px -20px #000c, 0 0 0 1px #ffffff14; }
.card-over { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, #143424f2, #0d1a13fa); text-align: center; color: var(--cream); animation: fadein .35s ease-out; }
.card-over .big { font-size: clamp(2.6rem, 7vw, 4.2rem); line-height: 1; }
.card-over h3 { margin: 10px 0 6px; font: 800 clamp(1.3rem, 3vw, 1.9rem)/1.1 var(--serif); text-wrap: balance; }
.card-over p { margin: 0 auto; max-width: 44ch; font: 600 1rem/1.45 var(--sans); color: #fffaf3d9; }
.card-over .kicker { font: 800 .7rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.card-over .stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.card-over .stats span { padding: 5px 10px; border-radius: 99px; background: #ffffff14; font: 700 .82rem var(--sans); }
@keyframes fadein { from { opacity: 0; } }

/* ---- Theater ---- */
.theater { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.theater .slot { aspect-ratio: 16 / 10; width: 100%; }
.playlist { background: #101d16; border-radius: 16px; padding: 12px; box-shadow: 0 0 0 1px #ffffff14; max-height: min(78vh, 640px); overflow-y: auto; }
.playlist h2 { margin: 2px 4px 10px; font: 800 .72rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: #dcc79cb3; }
.pl { display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--cream); padding: 9px 8px; border-radius: 10px; cursor: pointer; }
.pl:hover { background: #ffffff0d; }
.pl.on { background: var(--cream); color: var(--ink); }
.pl .ic { grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #ffffff12; font-size: 1.1rem; }
.pl.on .ic { background: var(--forest); color: var(--paper); }
.pl .t { font: 800 .9rem/1.2 var(--display); }
.pl .s { font: 600 .76rem/1.3 var(--sans); color: #fffaf3a6; }
.pl.on .s { color: var(--ink-soft); }
.pl .who { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 1px; }
.pl.done:not(.on) .t::after { content: " ✓"; color: #9be58f; }
.transport { grid-column: 1 / -1; display: grid; gap: 10px; background: #101d16; border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 0 1px #ffffff14; }
.transport .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.transport .now { margin-left: auto; font: 700 .85rem var(--sans); color: #fffaf3cc; }
.tbtn { border: 0; border-radius: 99px; padding: 7px 13px; font: 800 .82rem var(--sans); cursor: pointer; background: #ffffff14; color: var(--cream); }
.tbtn.primary { background: var(--gold); color: var(--ink); }
.tbtn[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
.timeline { display: flex; gap: 3px; height: 34px; align-items: stretch; }
.seg-t { position: relative; flex: 1 1 0; min-width: 18px; border: 0; padding: 0; border-radius: 6px; background: #ffffff14; cursor: pointer; overflow: hidden; }
.seg-t.battle { flex-grow: 3.2; background: #ffffff1f; }
.seg-t.on { box-shadow: inset 0 0 0 2px var(--gold); }
.seg-t .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #e8b64a55; width: 0; }
.seg-t.done .fill { width: 100%; background: #ffffff26; }
.seg-t .lbl { position: relative; font: 800 .66rem/34px var(--display); color: #fffaf3bf; white-space: nowrap; padding: 0 6px; }
.seg-t .mk { position: absolute; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; transform: translateX(-50%); }
.mk.crit { background: #ff7a5a; }
.mk.ko { background: var(--paper); }
.mk.super { background: var(--gold); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font: 700 .72rem var(--sans); color: #fffaf3a6; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

/* ---- Chronicle (the Kird Gazette) ---- */
.paper { max-width: 1180px; margin: 0 auto; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 24px clamp(16px, 3vw, 40px) 34px; box-shadow: 0 30px 70px -30px #000; }
.mast { text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 10px; }
.mast h2 { margin: 0; font: 800 clamp(2rem, 6vw, 3.6rem)/1 var(--serif); letter-spacing: -.01em; }
.mast .dateline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; font: 700 .74rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.lead { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; padding: 18px 0; border-bottom: 1px solid #1c1b1733; }
.lead .slot { aspect-ratio: 4 / 3; border-radius: 4px; }
.lead .caption { font: italic 600 .8rem var(--serif); color: var(--ink-soft); margin: 6px 0 0; }
.story h3 { margin: 0 0 6px; font: 800 clamp(1.5rem, 3.2vw, 2.25rem)/1.05 var(--serif); text-wrap: balance; }
.story .deck { margin: 0 0 10px; font: italic 600 1.02rem/1.35 var(--serif); color: var(--ink-soft); }
.story p { margin: 0 0 10px; font: 400 .98rem/1.55 var(--sans); max-width: 62ch; }
.story .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.story .facts span { font: 700 .74rem var(--sans); padding: 3px 8px; border-radius: 4px; background: var(--cream); }
.watch { border: 0; border-radius: 99px; padding: 8px 14px; font: 800 .84rem var(--sans); background: var(--forest); color: var(--paper); cursor: pointer; }
.columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding-top: 16px; }
.columns > * { padding: 0 16px; border-left: 1px solid #1c1b1726; min-width: 0; }
.columns > *:first-child { border-left: 0; padding-left: 0; }
.columns > *:last-child { padding-right: 0; }
.columns h4 { margin: 0 0 6px; font: 800 1.2rem/1.15 var(--serif); text-wrap: balance; }
.columns p { margin: 0 0 10px; font: 400 .9rem/1.5 var(--sans); }
.brief { border-top: 1px solid #1c1b1726; padding-top: 8px; margin-top: 10px; }
.brief b { font: 800 .7rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--danger); }
.ledger { width: 100%; border-collapse: collapse; font: 600 .86rem var(--sans); font-variant-numeric: tabular-nums; }
.ledger td { padding: 5px 0; border-bottom: 1px dotted #1c1b1740; }
.ledger td:last-child { text-align: right; font-weight: 800; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

/* ---- Highlights (stories) ---- */
.stories { max-width: 520px; margin: 0 auto; }
.stories .slot { aspect-ratio: 4 / 5; }
.bars { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 9; display: flex; gap: 4px; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: #ffffff40; overflow: hidden; position: relative; }
.bars i b { position: absolute; inset: 0; width: 0; background: var(--paper); }
.bars i.done b { width: 100%; }
.story-cap { position: absolute; left: 12px; right: 12px; top: 22px; z-index: 9; display: flex; align-items: center; gap: 8px; color: var(--paper); font: 800 .82rem var(--sans); text-shadow: 0 1px 2px #000a; }
.story-cap .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--c, #555); font-size: .8rem; }
.tap { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 8; border: 0; background: none; cursor: pointer; }
.tap.prev { left: 0; }
.tap.next { right: 0; }
.stories .hint { text-align: center; font: 600 .82rem var(--sans); color: #fffaf399; margin: 10px 0 0; }
[data-variant="highlights"] #app.embedded #side-mine, [data-variant="highlights"] #app.embedded #side-foe { top: 52px; }
[data-variant="highlights"] #app.embedded .hpbox .who, [data-variant="highlights"] #app.embedded .reserve, [data-variant="highlights"] #app.embedded .mom, [data-variant="highlights"] #app.embedded .orders { display: none; }

@media (max-width: 999px) {
  .theater { grid-template-columns: minmax(0, 1fr); }
  .playlist { max-height: none; }
  .lead { grid-template-columns: minmax(0, 1fr); }
  .columns { grid-template-columns: minmax(0, 1fr); }
  .columns > * { border-left: 0; padding: 12px 0 0; border-top: 1px solid #1c1b1726; }
  .columns > *:first-child { border-top: 0; }
}
@media (max-width: 640px) {
  .cu-top { padding: 14px 16px 12px; }
  .cu-body { padding: 14px 16px 24px; }
  .theater .slot { aspect-ratio: 4 / 5; }
  .seg-t .lbl { display: none; }
  #app.embedded .hpbox { max-width: 58vw; }
  #app.embedded[data-layout="classic"] #side-mine { bottom: 70px; }
}
</style>

<div id="cu" data-variant="theater">
  <header class="cu-top">
    <div class="cu-title">
      <p class="eyebrow">Panda Diplomacy · The Kirds' world · Round 15 · Sample game</p>
      <h1>Since your last turn</h1>
      <p class="sub" id="cu-sub"></p>
    </div>
    <div class="seg" id="variants" role="group" aria-label="How to catch up"></div>
  </header>
  <div class="cu-body">
    <section class="variant v-theater" aria-label="Theater">
      <div class="theater">
        <div class="slot" id="slot-theater"></div>
        <aside class="playlist"><h2>While you were away</h2><div id="pl"></div></aside>
        <div class="transport">
          <div class="row">
            <button class="tbtn primary" id="t-play">❚❚ Pause</button>
            <button class="tbtn" id="t-prev">◀ Back</button>
            <button class="tbtn" id="t-next">Next ▶</button>
            <button class="tbtn" id="t-battle">Next battle ⚔️</button>
            <button class="tbtn" id="t-speed" aria-pressed="false">2×</button>
            <span class="now" id="t-now"></span>
          </div>
          <div class="timeline" id="tl"></div>
          <div class="legend"><span><i style="background:#ff7a5a"></i>Critical hit</span><span><i style="background:#e8b64a"></i>Super effective</span><span><i style="background:#fffaf3"></i>A squad wiped out</span></div>
        </div>
      </div>
    </section>
    <section class="variant v-chronicle" aria-label="Chronicle">
      <article class="paper" id="paper"></article>
    </section>
    <section class="variant v-highlights" aria-label="Highlights">
      <div class="stories">
        <div class="slot" id="slot-stories">
          <div class="bars" id="bars"></div>
          <div class="story-cap" id="story-cap"></div>
          <button class="tap prev" id="s-prev" aria-label="Previous story"></button>
          <button class="tap next" id="s-next" aria-label="Next story"></button>
        </div>
        <p class="hint">Tap the right side for the next story, the left to go back.</p>
      </div>
    </section>

    <!-- The battle renderer. It moves into whichever view is showing. -->
    <div id="app" class="embedded" data-layout="classic">
      <div id="main">
        <div id="stage">
          <canvas id="scene" aria-label="Battle replay"></canvas>
          <div id="overlay"></div>
          <div class="side" id="side-foe"></div>
          <div class="side" id="side-mine"></div>
          <div id="cutin"><div class="band"><span></span><small></small></div></div>
        </div>
        <div id="console">
          <div id="textbox"><p id="say" aria-live="polite"></p><span class="next" hidden>▼</span></div>
          <div id="menu"></div>
        </div>
        <div id="result" hidden></div>
      </div>
    </div>
  </div>
</div>

<script>
window.ARENA_CONFIG = { mode: "embed", ready: (api) => window.dispatchEvent(new CustomEvent("arena-ready", { detail: api })) };
</script>
